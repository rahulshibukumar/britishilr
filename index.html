<style>

<script>
const DATA=[{"name": "Chapter 1 – Geography and Locations", "qs": [{"n": 1, "q": "Which of the following castles is in Scotland?", "o": ["Craigievar Castle", "Caernarfon Castle", "Bodiam Castle", "Pevensey Castle"], "a": [0], "e": "Craigievar Castle is located in Scotland."}, {"n": 2, "q": "Where is the Giant's Causeway located?", "o": ["Scotland", "England", "Wales", "Northern Ireland"], "a": [3], "e": "The Giant's Causeway is a land formation of columns made from volcanic lava on the northeast coast of Northern Ireland. It formed about 50 million years ago, and there are many legends about how it was made."}, {"n": 3, "q": "When was the United Nations set up?", "o": ["After the First World War", "After the Second World War", "Before the First World War", "Before the Second World War"], "a": [1], "e": "The UN was set up after the Second World War. It aims to prevent war and promote international peace and security."}, {"n": 4, "q": "Each UK country is associated with a flower. Which country is associated with the rose?", "o": ["Wales", "Northern Ireland", "Scotland", "England"], "a": [3], "e": "England – the rose; Scotland – the thistle; Wales – the daffodil; Northern Ireland – the shamrock. They are sometimes worn on National Saints' Days."}, {"n": 5, "q": "Which TWO of these forts were part of Hadrian's Wall?", "o": ["Vindolanda", "Maiden Castle", "Housesteads", "Grimsby"], "a": [0, 2], "e": "Parts of Hadrian's Wall include the forts of Housesteads and Vindolanda."}, {"n": 6, "q": "Which of the following monuments is located in Wiltshire?", "o": ["Hadrian's Wall", "St Paul's Cathedral", "Nelson's Column", "Stonehenge"], "a": [3], "e": "Stonehenge stands in the English county of Wiltshire."}, {"n": 7, "q": "Who mapped the coast of Australia?", "o": ["James Cook", "Admiral Nelson", "Isaac Newton", "\"Sar Dean Muhammad\" (name unclear in transcript)"], "a": [0], "e": "Captain James Cook mapped the coast of Australia, and a few colonies were established there."}, {"n": 8, "q": "Which is the largest national park in England?", "o": ["Snowdonia", "Loch Lomond and the Trossachs National Park", "The Giant's Causeway", "The Lake District"], "a": [3], "e": "The Lake District is England's largest national park."}, {"n": 9, "q": "Where do Beefeaters serve as tour guides?", "o": ["The Houses of Parliament", "The Tower of London", "The O2", "Big Ben"], "a": [1], "e": "Beefeaters serve as tour guides at the Tower of London."}, {"n": 10, "q": "Which of the following is a Crown Dependency but not part of the UK?", "o": ["Shetland", "Isle of Wight", "Isle of Man", "Anglesey"], "a": [2], "e": "The Channel Islands and the Isle of Man are closely linked with the UK but are not part of it. They have their own governments and are called Crown Dependencies."}, {"n": 11, "q": "Is St Helena part of the UK?", "o": ["Yes", "No"], "a": [1], "e": "British Overseas Territories such as St Helena and the Falkland Islands are linked to the UK but are not part of it."}, {"n": 12, "q": "Where is Loch Lomond and the Trossachs National Park located?", "o": ["England", "Wales", "Scotland", "Northern Ireland"], "a": [2], "e": "It is located in the west of Scotland."}, {"n": 13, "q": "What is the capital city of Northern Ireland?", "o": ["Cork", "Edinburgh", "Belfast", "Dublin"], "a": [2], "e": "The capital city of Northern Ireland is Belfast."}, {"n": 14, "q": "Where is the Lake District National Park located?", "o": ["Scotland", "Wales", "England", "Northern Ireland"], "a": [2], "e": "The Lake District is in England."}, {"n": 15, "q": "£100 is the highest value note in circulation in the UK.", "o": ["True", "False"], "a": [1], "e": "This statement is false."}, {"n": 16, "q": "Is Northern Ireland part of Great Britain?", "o": ["Yes", "No"], "a": [1], "e": "Great Britain refers only to England, Scotland and Wales, not Northern Ireland."}, {"n": 17, "q": "How many national parks are there in England, Wales and Scotland?", "o": ["25", "15", "42"], "a": [1], "e": "There are 15 national parks in England, Wales and Scotland. (Only three options were captured.)"}, {"n": 18, "q": "Northern Ireland and Scotland have their own banknotes which are valid everywhere in the UK.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 19, "q": "What UK landmark was voted Britain's favourite view in 2007?", "o": ["Big Ben", "Lake District", "Snowdonia", "The London Eye"], "a": [1], "e": "In 2007, television viewers voted Wast Water in the Lake District Britain's favourite view."}, {"n": 20, "q": "The Falkland Islands are a British Overseas Territory and a part of the United Kingdom.", "o": ["True", "False"], "a": [1], "e": "The Falkland Islands are a British Overseas Territory, linked to the UK but not part of it."}, {"n": 21, "q": "What is the capital city of Scotland?", "o": ["Glasgow", "St Andrews", "Edinburgh", "Aberdeen"], "a": [2], "e": "The capital city of Scotland is Edinburgh."}, {"n": 22, "q": "Which TWO of the following are British Overseas Territories?", "o": ["St Helena", "Solomon Islands", "Mauritius", "The Falkland Islands"], "a": [0, 3], "e": "St Helena and the Falkland Islands are linked to the UK but are not part of it."}, {"n": 23, "q": "Which of the following is NOT a valid UK coin?", "o": ["1p", "5p", "25p", "£1"], "a": [2], "e": "There are no 25p coins in the UK currency."}, {"n": 24, "q": "Where is Swansea located?", "o": ["England", "Northern Ireland", "Scotland", "Wales"], "a": [3], "e": "Swansea is in Wales."}, {"n": 25, "q": "Where was William Shakespeare born?", "o": ["Manchester", "Lincolnshire", "Stratford-upon-Avon", "(option not captured in transcript)"], "a": [2], "e": "Shakespeare was born in Stratford-upon-Avon, England."}, {"n": 26, "q": "Which THREE territories form Great Britain?", "o": ["Wales", "Northern Ireland", "England", "Scotland"], "a": [0, 2, 3], "e": "Great Britain refers only to England, Scotland and Wales, not Northern Ireland."}, {"n": 27, "q": "There are 15 national parks in England, Wales and Scotland. What are national parks?", "o": ["Giant greenhouses", "Land formations of columns made from volcanic lava", "Areas of protected countryside", "Medieval buildings"], "a": [2], "e": "National parks are areas of protected countryside that everyone can visit, and where people live, work and look after the landscape."}, {"n": 28, "q": "Where is the Eden Project located?", "o": ["Dorset", "Cornwall", "Devon", "Somerset"], "a": [1], "e": "The Eden Project is in Cornwall, in the southwest of England."}, {"n": 29, "q": "St Helena and the Falkland Islands are part of Great Britain.", "o": ["True", "False"], "a": [1], "e": "They are British Overseas Territories in other parts of the world, linked to the UK but not part of it."}, {"n": 30, "q": "Where is the official home of the Prime Minister?", "o": ["18 Oxford Street", "Buckingham Palace", "Windsor Castle", "10 Downing Street"], "a": [3], "e": "The official home of the Prime Minister is 10 Downing Street."}, {"n": 31, "q": "Great Britain refers only to England, Wales and Scotland.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 32, "q": "Scotland has its own banknotes which are valid everywhere in the UK.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 33, "q": "Cardiff is the capital city of which country?", "o": ["Scotland", "Northern Ireland", "Ireland", "Wales"], "a": [3], "e": "The capital city of Wales is Cardiff."}, {"n": 34, "q": "The Lake District is the largest national park of England.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 35, "q": "What is the name of the area in London where famous theatres are located?", "o": ["Soho", "Theatreland", "Westminster", "Hyde Park"], "a": [1], "e": "London's West End, also known as Theatreland, is particularly well known for its theatres."}, {"n": 36, "q": "Where is Snowdonia located?", "o": ["Scotland", "Wales", "England", "Northern Ireland"], "a": [1], "e": "Snowdonia is in Wales."}, {"n": 37, "q": "Which TWO countries developed Concorde, the world's only supersonic commercial airliner?", "o": ["Italy", "Britain", "Germany", "France"], "a": [1, 3], "e": "Britain and France developed Concorde."}, {"n": 38, "q": "Northern Ireland has its own banknotes, which are valid everywhere in the UK.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 39, "q": "Which of the following is a Crown Dependency but not part of the UK?", "o": ["Northern Ireland", "Wales", "The Channel Islands", "Scotland"], "a": [2], "e": "The Channel Islands are linked to the UK but are not part of it. (The video wrongly calls them an \"overseas territory\" – they are a Crown Dependency.)"}, {"n": 40, "q": "Where is the UK geographically located?", "o": ["Southwest of Europe", "Northeast of Europe", "Northwest of Europe", "Southeast of Europe"], "a": [2], "e": "The UK is located in the northwest of Europe."}, {"n": 41, "q": "Where is Big Ben located?", "o": ["Buckingham Palace", "The Tower of London", "Trafalgar Square", "The Houses of Parliament"], "a": [3], "e": "Big Ben is the nickname for the great bell of the clock at the Houses of Parliament in London."}, {"n": 42, "q": "Where did the first farmers come from?", "o": ["Southwest Europe", "Southeast Europe", "Northeast America", "Northwest Asia"], "a": [1], "e": "The first farmers arrived in Britain about 6,000 years ago. Their ancestors probably came from Southeast Europe."}, {"n": 43, "q": "St Helena is a British Overseas Territory and it is part of the United Kingdom.", "o": ["True", "False"], "a": [1], "e": "British Overseas Territories such as St Helena and the Falkland Islands are linked to the UK but are not part of it."}]}, {"name": "Chapter 2 – British History and Monarchy", "qs": [{"n": 1, "q": "Which historical monument did William the Conqueror build?", "o": ["St Paul's Cathedral", "The Cenotaph", "Apsley House", "The White Tower"], "a": [3], "e": "The White Tower in the Tower of London is an example of a Norman castle keep, built on the orders of William the Conqueror."}, {"n": 2, "q": "When did the Emancipation Act abolish slavery throughout the British Empire?", "o": ["1835", "1823", "1807", "1833"], "a": [3], "e": "In 1833 the Emancipation Act abolished slavery throughout the British Empire."}, {"n": 3, "q": "What is the name of the Irish people who favoured complete independence from the UK in the 19th century?", "o": ["Fenians", "Quakers", "Highlanders", "Suffragettes"], "a": [0], "e": "The Irish nationalist movement grew strongly through the 19th century. Some, such as the Fenians, favoured complete independence."}, {"n": 4, "q": "What was the religion of the Puritans?", "o": ["Hindu", "Catholic", "Sikh", "Protestant"], "a": [3], "e": "The Puritans were a group of Protestants who advocated strict and simple religious doctrine and worship."}, {"n": 5, "q": "When did the first farmers come to Britain?", "o": ["10,000 years ago", "6,000 years ago", "15,000 years ago", "2,000 years ago"], "a": [1], "e": "The first farmers arrived in Britain 6,000 years ago."}, {"n": 6, "q": "Which TWO languages were used across England during the Middle Ages?", "o": ["Welsh", "Gaelic", "Norman French", "Anglo-Saxon"], "a": [2, 3], "e": "After the Norman Conquest, the king and his noblemen spoke Norman French, and the peasants continued to speak Anglo-Saxon."}, {"n": 7, "q": "In 1776, which British colonies declared independence, demanding \"no taxation without representation\"?", "o": ["North African", "Asian", "North American", "South African"], "a": [2], "e": "In 1776, 13 American colonies declared independence, stating that people had a right to establish their own governments."}, {"n": 8, "q": "When was England ruled by a republic and not by a monarch?", "o": ["When Elizabeth I died without any successor", "When Charles I was executed", "When Magna Carta restricted the king's power", "When King Harold died after the Battle of Hastings"], "a": [1], "e": "When Charles I was executed, England declared itself a republic called the Commonwealth. It no longer had a monarch."}, {"n": 9, "q": "Under which name was the movement against the authority of the Pope during Henry VIII's time known?", "o": ["The Spanish Inquisition", "The Holy Wars", "The Reformation", "The Enlightenment"], "a": [2], "e": "The correct answer is the Reformation."}, {"n": 10, "q": "Which of the following tells us how people lived in England just after the Norman Conquest?", "o": ["The Domesday Book", "The Book of Common Prayer", "The Canterbury Tales", "Magna Carta"], "a": [0], "e": "William sent people all over England to list the towns, villages, who lived there, who owned the land and what animals they owned. This was the Domesday Book. It still exists and gives a picture of society just after the Norman Conquest."}, {"n": 11, "q": "James I was king of which country before becoming king of England?", "o": ["Wales", "Ireland", "France", "Scotland"], "a": [3], "e": "When Elizabeth I died, her cousin James VI of Scotland became James I of England. Wales, Ireland and Scotland remained separate countries."}, {"n": 12, "q": "Who was William Caxton?", "o": ["A poet who wrote about people going to Canterbury on a pilgrimage", "The first person in England to print books using a printing press", "The first person to sail single-handed around the world", "The inventor of the television"], "a": [1], "e": "William Caxton was the first person in England to print books using a printing press."}, {"n": 13, "q": "How did Charles II escape to Europe after his defeat in the civil war?", "o": ["Hiding in a farmer's house", "Riding a horse", "Hiding in an oak tree", "Swimming"], "a": [2], "e": "Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe."}, {"n": 14, "q": "In the Scottish clan rebellion, Bonnie Prince Charlie was supported by clansmen from which region?", "o": ["Glasgow", "Galloway", "The Highlands", "Edinburgh"], "a": [2], "e": "Charles Edward Stuart (Bonnie Prince Charlie) was supported by clansmen from the Scottish Highlands."}, {"n": 15, "q": "When was the Domesday Book written?", "o": ["After the Viking invasion", "After the Norman Conquest", "After the last Roman invasion", "After the Anglo-Saxon invasion"], "a": [1], "e": "William the Conqueror had lists drawn up of all towns, villages, people, landowners and animals. This gives a picture of society just after the Norman Conquest."}, {"n": 16, "q": "What is the name of the war memorial located in Whitehall?", "o": ["Apsley House", "The Cenotaph", "Royal Crescent", "The White Tower"], "a": [1], "e": "The Cenotaph is a war memorial in Whitehall."}, {"n": 17, "q": "Which TWO languages combined to become the English language?", "o": ["Latin", "Anglo-Saxon", "Proto-Celtic", "Norman French"], "a": [1, 3], "e": "After the Norman Conquest, the king and nobles spoke Norman French and the peasants spoke Anglo-Saxon. Gradually the two combined into English."}, {"n": 18, "q": "Which Scottish king defeated the English at the Battle of Bannockburn?", "o": ["King Charles I", "King James I", "Admiral Nelson", "Robert the Bruce"], "a": [3], "e": "In 1314, the Scots led by Robert the Bruce defeated the English at Bannockburn, and Scotland remained unconquered by the English."}, {"n": 19, "q": "Between 1680 and 1720, many refugees called Huguenots came to England. Which country did they come from?", "o": ["Pakistan", "Germany", "India", "France"], "a": [3], "e": "The Huguenots came from France."}, {"n": 20, "q": "What was inscribed on the first coins minted in Britain during the Iron Age?", "o": ["The names of Iron Age kings", "The names of Iron Age gods", "The names of trees", "The names of animals"], "a": [0], "e": "The people of the Iron Age made the first coins minted in Britain, some inscribed with the names of Iron Age kings."}, {"n": 21, "q": "When were the first coins in Britain made?", "o": ["The Stone Age", "The Bronze Age", "The Iron Age", "The Middle Ages"], "a": [2], "e": "The people of the Iron Age made the first coins minted in Britain."}, {"n": 22, "q": "Charles I believed in the divine right of kings. So he tried to…", "o": ["Rule without Parliament", "Rule with the approval of Parliament", "Raise money for Parliament", "Restore Catholicism in Britain"], "a": [0], "e": "Charles I believed the king was directly appointed by God to rule and should act without seeking Parliament's approval, so he tried to rule without Parliament at all."}, {"n": 23, "q": "Wales has its own established church.", "o": ["True", "False"], "a": [1], "e": "There is no established church in Wales or Northern Ireland."}, {"n": 24, "q": "Which English king introduced the Domesday Book?", "o": ["Henry V", "Henry IV", "William the Conqueror", "Harold, the Saxon king of England"], "a": [2], "e": "William the Conqueror sent people all over England to list the towns, villages, people, landowners and animals. This was the Domesday Book."}, {"n": 25, "q": "Who built a wall in the north of England to keep out the Picts, ancestors of the Scottish people?", "o": ["Boudicca", "Emperor Hadrian", "Emperor Claudius", "Julius Caesar"], "a": [1], "e": "Emperor Hadrian built the wall to keep out the Picts."}, {"n": 26, "q": "What movement challenged the authority of the Pope?", "o": ["The Swinging 60s", "The Reformation", "The Suffragettes", "The Enlightenment"], "a": [1], "e": "The Reformation was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church."}, {"n": 27, "q": "What did the Habeas Corpus Act introduce?", "o": ["That every prisoner has a right to a court hearing", "A salary for Members of Parliament", "Financial help for the unemployed", "Old age pensions and free school meals"], "a": [0], "e": "The Habeas Corpus Act became law in 1679. \"Habeas corpus\" is Latin for \"you must present the person in court\". It guaranteed that no one could be held prisoner unlawfully."}, {"n": 28, "q": "How did the government promote free trade during the Victorian age?", "o": ["Abolishing several taxes on imported goods", "Abolishing the exportation of local produce", "Preventing the importation of cheap raw materials", "Preventing the importation of cheap grain"], "a": [0], "e": "The government abolished several taxes on imported goods, e.g. the repeal of the Corn Laws in 1846 (which had blocked cheap grain). Raw materials could then be imported cheaply, helping British industry."}, {"n": 29, "q": "During the Middle Ages, who were the serfs?", "o": ["Peasants who had a small area of their lord's agricultural land", "Soldiers who fought at Trafalgar", "Noblemen who formed part of the king's council of advisers", "A group of skilled people from Holland who came to England"], "a": [0], "e": "Serfs were peasants who had a small area of their lord's land where they could grow food."}, {"n": 30, "q": "Which invention led to the rapid development of industry in Britain in the 18th and 19th centuries?", "o": ["Radar", "Steam power", "The jet engine", "The Turing machine"], "a": [1], "e": "The Industrial Revolution happened because of the development of machinery and the use of steam power. Britain was the first country to industrialise on a large scale."}, {"n": 31, "q": "What happened to Mary, Queen of Scots, after 20 years in prison?", "o": ["She became queen of England", "She was sent to France", "She escaped to Denmark", "She was executed"], "a": [3], "e": "Mary was executed, accused of plotting against Elizabeth I."}, {"n": 32, "q": "Who were the first people to live in Britain in the Stone Age?", "o": ["Farmers", "Peasants", "Hunter-gatherers", "Pirates"], "a": [2], "e": "The first people to live in Britain were hunter-gatherers."}, {"n": 33, "q": "What is the name of the movement against the authority of the Pope that took place during Henry VIII's reign?", "o": ["The Reformation", "The Enlightenment", "The Glorious Revolution", "The Renaissance"], "a": [0], "e": "The correct answer is the Reformation."}, {"n": 34, "q": "What is the name of the process by which many Scottish landlords destroyed small farms (crofts) to make space for large flocks of sheep and cattle?", "o": ["The Black Death", "The Corn Removal", "The Highland Clearances", "The Enlightenment"], "a": [2], "e": "This process became known as the Highland Clearances."}, {"n": 35, "q": "In 1833, the Emancipation Act abolished slavery throughout the British Empire.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 36, "q": "Which Scottish clan was killed for not taking the oath?", "o": ["The MacLeans of Loch Buie (unclear in transcript)", "The McDougalls of Glen… (unclear in transcript)", "The Macphersons of Cluny (unclear in transcript)", "The MacDonalds of Glencoe"], "a": [3], "e": "The MacDonalds of Glencoe."}, {"n": 37, "q": "What was the biggest source of employment during the 18th century?", "o": ["Fishing", "Teaching", "Aircraft industry", "Manufacturing"], "a": [3], "e": "During the 18th century, manufacturing jobs became the main source of employment in Britain."}, {"n": 38, "q": "In 1314, the Scots led by Robert the Bruce defeated the English at Bannockburn and Scotland remained unconquered by the English.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 39, "q": "The Bill of Rights in 1689 gave women the right to vote.", "o": ["True", "False"], "a": [1], "e": "The Bill of Rights 1689 confirmed the rights of Parliament and the limits of the king's power."}, {"n": 40, "q": "What was achieved with Magna Carta?", "o": ["It restricted the king's power", "It increased the king's power", "It restricted the rights of farmers", "It increased women's power"], "a": [0], "e": "Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king's power to collect taxes or make and change laws. The king would need to involve his noblemen in decisions."}, {"n": 41, "q": "During which period did the Beatles become popular and social laws were liberalised?", "o": ["1960s", "1970s", "1980s", "1950s"], "a": [0], "e": "The 1960s, the \"Swinging 60s\", saw growth in British fashion, cinema and pop music (the Beatles, the Rolling Stones). Social laws were liberalised, e.g. on divorce and abortion, and women's position in the workplace improved."}, {"n": 42, "q": "Who did the English defeat in 1588?", "o": ["The Normans", "The Romans", "The Spanish Armada", "The Saxons"], "a": [2], "e": "In 1588 the English defeated the Spanish Armada, a large fleet of ships."}, {"n": 43, "q": "Who established the Church of England?", "o": ["Henry VIII", "Oliver Cromwell", "Winston Churchill", "William of Orange"], "a": [0], "e": "The correct answer is Henry VIII."}, {"n": 44, "q": "Who was reigning when English settlers first began to colonise the eastern coast of America?", "o": ["Queen Victoria", "Henry VIII", "Elizabeth I", "Charles II"], "a": [2], "e": "In Elizabeth I's time, English settlers first began to colonise the eastern coast of America."}, {"n": 45, "q": "Which king was executed in 1649?", "o": ["James I", "Charles II", "James II", "Charles I"], "a": [3], "e": "The correct answer is Charles I."}, {"n": 46, "q": "Northern Ireland has its own established church.", "o": ["True", "False"], "a": [1], "e": "There is no established church in Wales or Northern Ireland."}, {"n": 47, "q": "Who made the first coins minted in Britain?", "o": ["The people of the Stone Age", "The Anglo-Saxons", "The people of the Iron Age", "The Romans"], "a": [2], "e": "The people of the Iron Age made the first coins, some inscribed with the names of Iron Age kings. This marks the beginning of British history."}, {"n": 48, "q": "William of Orange was asked by Protestants to invade England; when he arrived there was no resistance and he took the throne. This event was later known as…", "o": ["The Glorious Revolution", "The Restoration", "The Great Depression", "The Blitz"], "a": [0], "e": "This event was called the Glorious Revolution."}, {"n": 49, "q": "Who is the patron saint of Northern Ireland?", "o": ["St George", "St Patrick", "St Andrew", "St David"], "a": [1], "e": "The patron saint of Northern Ireland is St Patrick."}, {"n": 50, "q": "What is the name of the period when new ideas about politics, philosophy and science were developed?", "o": ["The Enlightenment", "The Glorious Revolution", "The Swinging 60s", "The Reformation"], "a": [0], "e": "During the 18th century new ideas about politics, philosophy and science were developed. This is often called the Enlightenment."}, {"n": 51, "q": "Which king was defeated by Oliver Cromwell in the Civil War and hid in an oak tree before escaping to Europe?", "o": ["Richard III", "Charles II", "James I", "Henry IV"], "a": [1], "e": "The correct answer is Charles II."}, {"n": 52, "q": "Who was the father of Queen Elizabeth I?", "o": ["Edward I", "Henry V", "Henry VII", "Henry VIII"], "a": [3], "e": "The father of Elizabeth I was Henry VIII."}, {"n": 53, "q": "What sort of church is the Church of Scotland?", "o": ["Catholic", "Baptist", "Presbyterian", "Methodist"], "a": [2], "e": "In Scotland the national church is the Church of Scotland, which is Presbyterian."}, {"n": 54, "q": "Which court deals with minor criminal offences in Scotland?", "o": ["The Sheriff Court", "The Magistrates' Court", "The Crown Court", "The Justice of the Peace Court"], "a": [3], "e": "In Scotland, minor criminal offences go to a Justice of the Peace Court."}, {"n": 55, "q": "Which TWO of the following records give us information about England during the reign of William I?", "o": ["Magna Carta", "The Domesday Book", "The Bayeux Tapestry", "The Canterbury Tales"], "a": [1, 2], "e": "The Domesday Book and the Bayeux Tapestry."}, {"n": 56, "q": "In 1913 the British government promised home rule for Ireland. Why were changes delayed until 1921?", "o": ["Due to the outbreak of the First World War", "Due to the outbreak of the Second World War", "Because there was no king on the British throne", "Due to the outbreak of the Black Death"], "a": [0], "e": "The outbreak of the First World War led the government to postpone any changes in Ireland."}, {"n": 57, "q": "Why did Henry VIII establish the Church of England?", "o": ["To celebrate his wedding with Anne of Cleves", "To have control over religious people", "To establish a unique religion in England", "To divorce his first wife, Catherine of Aragon"], "a": [3], "e": "To divorce Catherine he needed the Pope's approval. When the Pope refused, Henry established the Church of England."}, {"n": 58, "q": "Wales has its own established church.", "o": ["True", "False"], "a": [1], "e": "There is no established church in Wales or Northern Ireland."}, {"n": 59, "q": "Who was the tribal leader who fought against the Romans?", "o": ["Cleopatra", "Claudia", "Boudicca", "St Augustine"], "a": [2], "e": "Boudicca, queen of the Iceni in what is now eastern England, was one of the tribal leaders who fought the Romans."}, {"n": 60, "q": "Which Jubilee did Queen Elizabeth II celebrate in 2012?", "o": ["Golden Jubilee", "Silver Jubilee", "Platinum Jubilee", "Diamond Jubilee"], "a": [3], "e": "The Queen reigned from her father's death in 1952, and in 2012 celebrated her Diamond Jubilee – 60 years as queen."}, {"n": 61, "q": "When did the Black Death take place?", "o": ["The Golden Age", "The Stone Age", "The Middle Ages", "The Iron Age"], "a": [2], "e": "The Black Death came to Britain in 1348, in the Middle Ages."}, {"n": 62, "q": "Who is the patron saint of Wales?", "o": ["St David", "St George", "St Patrick", "St Andrew"], "a": [0], "e": "The patron saint of Wales is St David."}, {"n": 63, "q": "Where was Anne Boleyn, wife of Henry VIII, executed?", "o": ["Houses of Parliament", "Stonehenge", "Tower of London", "Whitehall"], "a": [2], "e": "Anne Boleyn was unpopular in the country and accused of taking lovers. She was executed at the Tower of London."}, {"n": 64, "q": "Which sport can be traced back to 15th-century Scotland?", "o": ["Golf", "Tennis", "Football", "Rugby"], "a": [0], "e": "The modern game of golf can be traced back to 15th-century Scotland."}, {"n": 65, "q": "Where are the Crown Jewels kept?", "o": ["At the House of Commons", "At the Tower of London", "At Buckingham Palace", "At Windsor Castle"], "a": [1], "e": "The Crown Jewels are kept at the Tower of London."}, {"n": 66, "q": "Which was the last successful foreign invasion of England, in 1066?", "o": ["The Viking invasion", "The Anglo-Saxon conquest", "The Roman invasion", "The Norman Conquest"], "a": [3], "e": "The Norman Conquest was the last successful foreign invasion of England."}, {"n": 67, "q": "When was Magna Carta created?", "o": ["(garbled in transcript)", "1215", "(garbled in transcript)", "(garbled in transcript)"], "a": [1], "e": "Magna Carta was created in 1215."}, {"n": 68, "q": "When did Ireland become a republic?", "o": ["1925", "1939", "1949", "1927"], "a": [2], "e": "Ireland became a republic in 1949."}]}, {"name": "Chapter 3 – Government and Politics", "qs": [{"n": 1, "q": "Who became Prime Minister after Margaret Thatcher and played an important part in the Northern Ireland peace process?", "o": ["James Callaghan", "John Major", "Tony Blair", "Harold Wilson"], "a": [1], "e": "John Major was Prime Minister after Mrs Thatcher and helped establish the Northern Ireland peace process."}, {"n": 2, "q": "What is the maximum amount you can claim through the small claims procedure in Scotland and Northern Ireland?", "o": ["£3,000", "£5,000", "£8,000", "£10,000"], "a": [0], "e": "The small claims procedure is an informal way of settling disputes without spending a lot of time and money on a lawyer. It is used for claims of less than £10,000 in England and Wales and £3,000 in Scotland and Northern Ireland."}, {"n": 3, "q": "Who was the Labour leader who introduced a Scottish Parliament and a Welsh Assembly?", "o": ["James Callaghan", "Clement Attlee", "Gordon Brown", "Tony Blair"], "a": [3], "e": "In 1997 Labour, led by Tony Blair, was elected. The Blair government introduced a Scottish Parliament and a Welsh Assembly."}, {"n": 4, "q": "Who can hear cases in youth courts in England, Wales and Northern Ireland? (Two answers)", "o": ["Specially trained magistrates", "Social workers", "District judges", "Members of the public"], "a": [0, 2], "e": "If the accused is aged 10 to 17, the case is normally heard in a youth court before up to three specially trained magistrates or a district judge. The most serious cases go to the Crown Court. Parents or carers are expected to attend. Members of the public are not allowed, and the name or photograph of the young person cannot be published."}, {"n": 5, "q": "What is the Queen's Speech about during the opening of the UK Parliament?", "o": ["What the royal family did the previous year", "What the government did the previous year", "What business matters the royal family will conduct in the year ahead", "What the government's policies will be in the year ahead"], "a": [3], "e": "The monarch opens the new parliamentary session each year with a speech summarising the government's policies for the year ahead. All Acts of Parliament are made in the monarch's name."}, {"n": 6, "q": "Who is responsible for crime, policing and immigration?", "o": ["The Chancellor of the Exchequer", "The Foreign Secretary", "The Speaker", "The Home Secretary"], "a": [3], "e": "The Home Secretary is responsible for crime, policing and immigration."}, {"n": 7, "q": "The members of the House of Lords, known as peers, are elected by the people.", "o": ["True", "False"], "a": [1], "e": "Peers are not elected by the people."}, {"n": 8, "q": "In England, Wales and Northern Ireland, youth court cases are normally heard by… (Choose two)", "o": ["Up to three specially trained magistrates", "A district judge", "A sheriff", "Up to five specially trained magistrates"], "a": [0, 1], "e": "Cases involving 10–17 year olds are normally heard by up to three specially trained magistrates or a district judge."}, {"n": 9, "q": "What is the Commonwealth?", "o": ["An organisation responsible for protecting and promoting human rights in its member countries", "A group of European and North American countries that have agreed to help each other if attacked", "An association of countries that support each other and work together towards shared goals in democracy and development", "An international organisation that aims to prevent war and promote peace and security"], "a": [2], "e": "Most member states were once part of the British Empire, although a few that were not have also joined."}, {"n": 10, "q": "Who was elected British Prime Minister in 1945?", "o": ["Clement Attlee", "Winston Churchill", "Harold Wilson", "Harold Macmillan"], "a": [0], "e": "In 1945 the British people elected a Labour government. The new Prime Minister was Clement Attlee."}, {"n": 11, "q": "The system of government in the UK is a parliamentary democracy.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 12, "q": "Who appoints life peers in the House of Lords?", "o": ["The Speaker", "The Archbishop of Canterbury", "The Prime Minister", "The monarch"], "a": [3], "e": "Life peers are appointed by the monarch on the advice of the Prime Minister."}, {"n": 13, "q": "Proceedings in Parliament are broadcast on television and published in official reports known as…", "o": ["Canvassing", "Hansard", "Cabinets", "Domesday Book"], "a": [1], "e": "Parliamentary proceedings are published in official reports called Hansard."}, {"n": 14, "q": "How are the members of the Northern Ireland Assembly elected?", "o": ["By proportional representation using ranked voting", "Using the first-past-the-post system", "Using a run-off system"], "a": [0], "e": "The Assembly's elected members (MLAs) are chosen by a form of proportional representation. (The video says 108 members; the current number is 90 – see Q25.)"}, {"n": 15, "q": "Which of the following statements is correct?", "o": ["Most shops in the UK open 7 days a week", "All shops in the UK close on Sundays and bank holidays"], "a": [0], "e": "Most shops are open 7 days a week, although trading hours on Sundays and public holidays are generally reduced."}, {"n": 16, "q": "Are civil servants appointed by the government?", "o": ["Yes", "No"], "a": [1], "e": "Civil servants are accountable to ministers. They are chosen on merit and are politically neutral – not political appointees."}, {"n": 17, "q": "In the UK you have to be 21 to vote in a general election.", "o": ["True", "False"], "a": [1], "e": "The voting age of 18 was set in 1969. With a few exceptions, all UK-born and naturalised adult citizens can vote."}, {"n": 18, "q": "Who is responsible for opening the new parliamentary session each year?", "o": ["The Prime Minister", "The Speaker", "The monarch (the Queen in the video)", "The Home Secretary"], "a": [2], "e": "The monarch has important ceremonial roles, such as opening the new parliamentary session each year."}, {"n": 19, "q": "The UK government has never suspended the Northern Ireland Assembly.", "o": ["True", "False"], "a": [1], "e": "The Assembly has been suspended on a few occasions."}, {"n": 20, "q": "By law, radio and television coverage of the political parties must be balanced, with equal time given to rival viewpoints.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 21, "q": "You have to be at least 21 years old to serve on a jury.", "o": ["True", "False"], "a": [1], "e": "Anyone on the electoral register aged 18 to 70 can serve on a jury."}, {"n": 22, "q": "How are civil servants appointed, and what party do they belong to?", "o": ["Chosen on merit; part of the Liberal Democrats", "Chosen randomly; part of the Conservative Party", "Chosen randomly; politically neutral", "Chosen on merit; politically neutral"], "a": [3], "e": "Civil servants are chosen on merit, are politically neutral and are not political appointees."}, {"n": 23, "q": "MPs can only be contacted at their office in the House of Commons.", "o": ["True", "False"], "a": [1], "e": "You can contact MPs by letter or telephone at their constituency office or at the House of Commons. Many MPs, AMs, MSPs and MEPs also hold local \"surgeries\" where constituents can talk to them in person."}, {"n": 24, "q": "Towns, cities and rural areas in the UK are governed by government-appointed officials.", "o": ["True", "False"], "a": [1], "e": "They are governed by democratically elected councils, often called local authorities."}, {"n": 25, "q": "How many members does the Northern Ireland Assembly have?", "o": ["12", "60", "90", "108"], "a": [2], "e": "The Assembly has 90 elected members, known as MLAs (Members of the Legislative Assembly)."}, {"n": 26, "q": "Is the BBC controlled by the government?", "o": ["Yes", "No"], "a": [1], "e": "The BBC is the largest broadcaster in the world and is a publicly funded media organisation that is independent of government."}, {"n": 27, "q": "What was Margaret Thatcher famous for?", "o": ["She fought for the right to vote for women", "She was the first woman Prime Minister of the UK", "She set up the Women's Franchise League", "She was the founder of modern nursing"], "a": [1], "e": "Margaret Thatcher was the UK's first woman Prime Minister."}, {"n": 28, "q": "The Northern Ireland Assembly cannot make decisions on which TWO issues?", "o": ["Immigration", "Education", "Agriculture", "Defence"], "a": [0, 3], "e": "The Assembly can decide on education, agriculture, the environment, health and social services, but not on immigration or defence."}, {"n": 29, "q": "When did the UK join the EU?", "o": ["1957", "1973", "1975", "1964"], "a": [1], "e": "The UK originally decided not to join, but became a member in 1973."}, {"n": 30, "q": "How many members does the Welsh government (Senedd) have?", "o": ["150", "120", "90", "60"], "a": [3], "e": "There are 60 members of the Senedd (MSs). Elections are held every four years using a form of proportional representation."}, {"n": 31, "q": "What is the small claims procedure?", "o": ["An informal way of helping people settle minor disputes without spending a lot of time and money on a lawyer", "A procedure that helps people make small home insurance claims in certain circumstances"], "a": [0], "e": "It is an informal way to settle minor disputes without spending a lot of time and money using a lawyer."}, {"n": 32, "q": "What did the Butler Act introduce in 1944?", "o": ["Free primary education in England, Wales and Scotland", "Free university fees in England, Wales, Scotland and Northern Ireland", "Free primary and secondary education in England, Wales and Scotland", "Free secondary education in England and Wales"], "a": [3], "e": "Richard Austen Butler, a Conservative MP, oversaw the Education Act 1944 (the Butler Act), which introduced free secondary education in England and Wales."}, {"n": 33, "q": "Northern Ireland uses individual registration, where all those entitled to vote must complete their own registration form.", "o": ["True", "False"], "a": [0], "e": "True (see Q47)."}, {"n": 34, "q": "Does Britain have a written constitution?", "o": ["Yes", "No"], "a": [1], "e": "The British constitution is not written down in any single document, so it is described as unwritten."}, {"n": 35, "q": "MPs can only be contacted by post.", "o": ["True", "False"], "a": [1], "e": "You can contact MPs by letter or telephone, at their constituency office or the House of Commons, and at local surgeries."}, {"n": 36, "q": "Which TWO of the following are NOT controlled by the devolved administrations?", "o": ["Health", "Education", "Defence", "Immigration"], "a": [2, 3], "e": "Defence, foreign affairs, immigration, taxation and social security remain under central UK government control. Many other services, such as education, are devolved."}, {"n": 37, "q": "How old do citizens of the UK, Irish Republic or Commonwealth have to be to stand for public office?", "o": ["18", "21", "16", "25"], "a": [0], "e": "Most such citizens aged 18 or over can stand for public office. Exceptions include members of the armed forces, civil servants and people guilty of certain criminal offences."}, {"n": 38, "q": "Which of the following is a responsibility of the Home Secretary?", "o": ["Economy", "Crime", "Education", "Defence"], "a": [1], "e": "The Home Secretary is responsible for crime, policing and immigration."}, {"n": 39, "q": "When was the last successful foreign invasion of England?", "o": ["1415", "1314", "1066", "1200"], "a": [2], "e": "The Norman Conquest in 1066."}, {"n": 40, "q": "How many members form a jury in Scotland?", "o": ["12", "14", "15", "20"], "a": [2], "e": "In Scotland a jury has 15 members."}, {"n": 41, "q": "What do you need to do to apply for a National Insurance number?", "o": ["Contact the NHS", "Contact the Department for Work and Pensions (DWP)", "Contact your local MP", "Ask your employer to get it for you"], "a": [1], "e": "If you have permission to work in the UK, you telephone the DWP to arrange to get a National Insurance number."}, {"n": 42, "q": "Which TWO issues can the devolved administrations pass laws on?", "o": ["Defence", "Social security", "Health", "Education"], "a": [2, 3], "e": "Defence, foreign affairs, immigration, taxation and social security stay with the UK government. Health and education are devolved."}, {"n": 43, "q": "What sort of election takes place when an MP dies or resigns?", "o": ["Coalition", "Pre-selection", "Random selection", "By-election"], "a": [3], "e": "A fresh election called a by-election is held in the constituency."}, {"n": 44, "q": "How often are members of the Welsh government elected?", "o": ["Every 5 years", "Every 2 years", "Every 4 years", "Every 3 years"], "a": [2], "e": "Elections are held every four years using a form of proportional representation."}, {"n": 45, "q": "Which TWO documents do you need to apply for a National Insurance number?", "o": ["A document with your address, such as a tenancy agreement", "Documents that prove you have permission to work in the UK", "A contract from your employer", "Documents that prove your identity"], "a": [1, 3], "e": "You need documents proving your identity and your permission to work in the UK."}, {"n": 46, "q": "Which TWO political parties formed a coalition in 2010?", "o": ["The Conservative Party", "The Green Party", "The Labour Party", "The Liberal Democrats"], "a": [0, 3], "e": "In May 2010 the Conservatives and Liberal Democrats formed a coalition; Conservative leader David Cameron became Prime Minister."}, {"n": 47, "q": "Scotland and Wales use individual registration, where all those entitled to vote must complete their own registration form.", "o": ["True", "False"], "a": [1], "e": "It is Northern Ireland that uses individual registration."}, {"n": 48, "q": "How often are Prime Minister's Questions held in Parliament?", "o": ["Every day", "Every week", "Every two weeks", "Once a month"], "a": [1], "e": "PMQs take place every week while Parliament is sitting."}, {"n": 49, "q": "As a British citizen, what are your responsibilities? (Two answers)", "o": ["To respect and obey the law", "To walk your dog only during the day", "To go to church on Sunday", "To look after yourself and your family"], "a": [0, 3], "e": "You should respect and obey the law, look after yourself and your family, respect others' rights including their right to their own opinions, treat others fairly, and look after your area and the environment."}, {"n": 50, "q": "Which of the following is known as canvassing?", "o": ["Donating blood to help people", "Volunteering for an environmental charity", "Caring for animals at a rescue shelter", "Persuading people to vote for a political party"], "a": [3], "e": "Party members persuade people to vote for their candidates, e.g. by handing out leaflets or knocking on doors. This is canvassing."}, {"n": 51, "q": "What sort of charity is Friends of the Earth?", "o": ["An environmental charity", "A medical research charity", "A charity working with pets", "A charity working with older people"], "a": [0], "e": "Friends of the Earth is an environmental charity."}, {"n": 52, "q": "Which statement is true?", "o": ["Mary Stuart, Queen of Scots, was a Protestant", "Mary Stuart, Queen of Scots, was a Catholic"], "a": [1], "e": "Mary, Queen of Scots, was a Catholic."}, {"n": 53, "q": "Which statement is true?", "o": ["Elizabeth I was a Protestant and found a balance between Catholics and more extreme Protestants", "Elizabeth I was a Catholic and found a balance between Catholics and more extreme Protestants"], "a": [0], "e": "Elizabeth I was a Protestant who balanced the views of Catholics and more extreme Protestants."}, {"n": 54, "q": "Where should you register if you want to be part of a jury?", "o": ["The electoral register", "Your local church", "The NHS", "The British Embassy"], "a": [0], "e": "People on the electoral register aged 18–70 are randomly selected for jury service."}, {"n": 55, "q": "By law, which TWO types of media must give balanced coverage of all political parties before an election?", "o": ["Television", "Internet", "Newspapers", "Radio"], "a": [0, 3], "e": "Radio and television coverage must be balanced, with equal time given to rival viewpoints."}, {"n": 56, "q": "Which TWO houses form the UK Parliament?", "o": ["The House of Lords", "House of Members", "The House of Commons", "House of Fraser"], "a": [0, 2], "e": "Parliament is made up of the House of Commons and the House of Lords."}, {"n": 57, "q": "How often are general elections held in the UK?", "o": ["Every 3 years", "Every 4 years", "Every 5 years", "Every 10 years"], "a": [2], "e": "MPs are elected at a general election held at least every 5 years."}, {"n": 58, "q": "Which TWO are key roles of school governors?", "o": ["Monitoring students' behaviour", "Monitoring and evaluating school performance", "Setting the strategic direction of the school", "Giving awards to the best students"], "a": [1, 2], "e": "Governors set the strategic direction, ensure accountability, and monitor and evaluate school performance."}, {"n": 59, "q": "It is compulsory for 16 and 17 year olds to join the National Citizen Service programme.", "o": ["True", "False"], "a": [1], "e": "The NCS gives 16–17 year olds the chance to enjoy outdoor activities, develop skills and join a community project. It is optional."}, {"n": 60, "q": "You have to be at least 21 years old to stand as an MP.", "o": ["True", "False"], "a": [1], "e": "The minimum age is 18 (see Q37)."}, {"n": 61, "q": "How many members does a jury have in England, Wales and Northern Ireland?", "o": ["9", "12", "15", "20"], "a": [1], "e": "In England, Wales and Northern Ireland a jury has 12 members."}, {"n": 62, "q": "Which statement is correct?", "o": ["Solicitors' charges are usually based on how much time they spend on a case", "Solicitors' charges are usually based on the nature and importance of a case"], "a": [0], "e": "Charges are usually based on time spent on a case."}, {"n": 63, "q": "By law, which TWO types of media must give balanced coverage of all political parties and equal time to rival viewpoints before an election?", "o": ["Television", "Internet", "Newspapers", "Radio"], "a": [0, 3], "e": "Radio and television coverage of political parties must be balanced."}, {"n": 64, "q": "What will you be given before a general election to vote?", "o": ["A poll tax relief", "A number to queue at the polling station", "A poll card", "A specific time to vote"], "a": [2], "e": "Before the election you are sent a poll card."}, {"n": 65, "q": "How is a jury selected?", "o": ["From the NHS registration system", "Randomly from the electoral register", "Alphabetically from the telephone directory", "From a postcode selection"], "a": [1], "e": "People on the electoral register aged 18–70 are randomly selected to serve on a jury."}, {"n": 66, "q": "What is the minimum age required to serve on a jury?", "o": ["16", "18", "21", "25"], "a": [1], "e": "Anyone on the electoral register aged 18 to 70 can be asked to serve."}, {"n": 67, "q": "Who chairs the debates in the House of Commons?", "o": ["A bishop (unclear in transcript)", "The Prime Minister", "The Speaker", "The Archbishop of Canterbury"], "a": [2], "e": "The Speaker chairs debates in the House of Commons."}, {"n": 68, "q": "The Bill of Rights of 1689 confirmed the right to vote for all adult men.", "o": ["True", "False"], "a": [1], "e": "The Bill of Rights 1689 confirmed the rights of Parliament and the limits of the king's power."}, {"n": 69, "q": "When were men and women given the right to vote at the age of 21?", "o": ["1918", "1903", "1928", "1923"], "a": [2], "e": "In 1928 women were given the vote at 21, the same as men."}, {"n": 70, "q": "What are TWO responsibilities you will have as a British citizen or permanent resident?", "o": ["To look after the area in which you live and the environment", "To look after yourself and your family", "To stay in the UK forever", "To promote work in your local community"], "a": [0, 1], "e": "You should respect and obey the law, look after yourself and your family, respect the rights of others, treat others fairly, and look after your area and the environment."}, {"n": 71, "q": "Several Church of England bishops sit in the House of Lords.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 72, "q": "What is the Home Secretary responsible for?", "o": ["Health", "Defence", "Education", "Policing"], "a": [3], "e": "The Home Secretary is responsible for crime, policing and immigration."}, {"n": 73, "q": "Which court deals with minor criminal cases in England, Wales and Northern Ireland?", "o": ["High Court", "Justice of the Peace Court", "Magistrates' Court", ect."}, {"n": 5, "q": "Anyone who is violent towards their partner, whether man or woman, married or living together, can be prosecuted.", "o": ["True", "False"], "a": [0], "e": "This is true."}, {"n": 6, "q": "What is the minimum age to drive a motorcycle?", "o": ["16", "17", "18", "21"], "a": [1], "e": "You must be at least 17 to drive a car or motorcycle, and you need a driving licence on public roads."}, {"n": 7, "q": "Can court orders be obtained to protect a person from being forced into marriage?", "o": ["Yes", "No"], "a": [0], "e": "Court orders can protect a person from being forced into a marriage, or protect someone already in a forced marriage."}, {"n": 8, "q": "How old do you have to be to go into betting shops or gambling clubs?", "o": ["18", "20", "16", "21"], "a": [0], "e": "You must be 18."}, {"n": 9, "q": "If you wish to be a permanent resident or citizen of the UK, you should… (Two answers)", "o": ["Respect the rights of others, including their right to their own opinions", "Buy a house in the UK", "Look after yourself and your family", "Marry a British citizen"], "a": [0, 2], "e": "You should also respect and obey the law, treat others fairly, and look after your area and the environment."}, {"n": 10, "q": "What is known as the \"Dunkirk spirit\"?", "o": ["When the German Air Force bombed London and other cities at night", "The evacuation of Allied soldiers from France during World War II", "When new social classes appeared after the Black Death", "The period when many Huguenot refugees came from France"], "a": [1], "e": "As France fell, Britain evacuated British and French soldiers in a huge naval operation. Many civilian volunteers in small pleasure and fishing boats helped rescue more than 300,000 men from the beaches around Dunkirk."}, {"n": 11, "q": "How old do you have to be to buy alcohol in the UK?", "o": ["17", "18", "19", "20"], "a": [1], "e": "It is an offence to sell alcohol to anyone under 18 or to buy it for them. One exception: people aged 16 or over can drink alcohol with a meal in a hotel or restaurant."}, {"n": 12, "q": "Who was Emmeline Pankhurst?", "o": ["A suffragette", "A nurse", "A doctor", "A scientist"], "a": [0], "e": "Born in Manchester in 1858, she set up the Women's Franchise League in 1889 and in 1903 helped found the Women's Social and Political Union (WSPU), whose members were the first to be called suffragettes."}, {"n": 13, "q": "Can the national anthem be played if the monarch is not present?", "o": ["Yes", "No"], "a": [0], "e": "It is played at important national occasions and at events attended by the monarch or royal family."}, {"n": 14, "q": "How can you make a complaint about the police? (Choose two)", "o": ["Write a complaint letter to the House of Commons", "Go to the police station directly", "Write to the chief constable of the police force involved", "Write to your MP"], "a": [1, 2], "e": "Complaints can also be made to an independent body: the Independent Police Complaints Commission (England and Wales), the Police Complaints Commissioner for Scotland, or the Police Ombudsman for Northern Ireland."}, {"n": 15, "q": "Which of the following charities helps the environment?", "o": ["NSPCC", "Shelter", "Friends of the Earth", "Crisis"], "a": [2], "e": "Friends of the Earth is an environmental charity."}, {"n": 16, "q": "What is the name of the UK currency?", "o": ["Euro", "Pound sterling", "Peso", "Dollar"], "a": [1], "e": "The currency is the pound sterling (£)."}, {"n": 17, "q": "Which statement is true?", "o": ["Women in Britain today make up about half of the workforce", "Women in Britain today make up about one quarter of the workforce"], "a": [0], "e": "Women make up about half of the workforce."}, {"n": 18, "q": "Which of the following is NOT a British banknote?", "o": ["£50", "£25", "£20", "£5"], "a": [1], "e": "There are no £25 notes."}, {"n": 19, "q": "The names and photographs of young people found guilty of a crime can be published in newspapers or used ts can only be made by writing to the chief constable of the police force involved.", "o": ["True", "False"], "a": [1], "e": "You can also go to a police station, or complain to an independent body (IPCC in England and Wales, the Police Complaints Commissioner for Scotland, the Police Ombudsman for Northern Ireland)."}, {"n": 26, "q": "What was the activist group that fought for women's right to vote?", "o": ["Chartists", "Beefeaters", "Suffragettes", "Quakers"], "a": [2], "e": "In the late 19th and early 20th centuries, more women campaigned for the vote and formed the women's suffrage movement; they became known as suffragettes."}, {"n": 27, "q": "Which of the following is an example of a criminal offence?", "o": ["Smoking in public places where it is not allowed", "Disputes about faulty goods or services", "Disputes about unfair dismissal at work", "A dispute between a landlord and tenants who have not paid rent"], "a": [0], "e": "It is against the law to smoke tobacco products in nearly every enclosed public place in the UK."}, {"n": 28, "q": "As a British citizen, you should… (Two answers)", "o": ["Respect and obey the law", "Vote in all elections", "Take part in religious activities", "Look after the area in which you live and the environment"], "a": [0, 3], "e": "These are the correct answers."}, {"n": 29, "q": "FGM, or taking a girl or woman abroad for FGM, is illegal in the UK and a criminal offence.", "o": ["True", "False"], "a": [0], "e": "This statement is true."}, {"n": 30, "q": "What year were women given the right to vote?", "o": ["1918", "1925", "1949", "1914"], "a": [0], "e": "In 1918 women over 30 were given the vote and the right to stand for Parliament."}, {"n": 31, "q": "If you are a dog owner, which TWO things should your dog's collar show?", "o": ["The owner's address", "The owner's name", "The dog's breed", "The dog's name"], "a": [0, 1], "e": "All dogs in public places must wear a collar showing the name and address of the owner."}, {"n": 32 hop of Canterbury."}, {"n": 5, "q": "Who is the head of the Church of England?", "o": ["The Prime Minister", "The Archbishop of Canterbury", "The Pope", "The monarch"], "a": [3], "e": "The monarch is the head of the Church of England."}, {"n": 6, "q": "Who was the first British Prime Minister?", "o": ["Winston Churchill", "Lord Wilmington", "Henry Pelham", "Sir Robert Walpole"], "a": [3], "e": "The most important minister in Parliament became known as the Prime Minister. The first was Sir Robert Walpole (PM 1721–1742)."}, {"n": 7, "q": "Who was the first Archbishop of Canterbury?", "o": ["St Patrick", "St Augustine", "St Andrew", "St Columba"], "a": [1], "e": "St Augustine led missionaries from Rome who spread Christianity in the south, and became the first Archbishop of Canterbury."}, {"n": 8, "q": "What happened to Mary, Queen of Scots, after 20 years in prison?", "o": ["She got married", "She was sent to France", "She was executed", "She was sent to Scotland"], "a": [2], "e": "She was executed, accused of plotting against Elizabeth I."}, {"n": 9, "q": "Who came from the Netherlands to become the British monarch?", "o": ["William II", "Charles II", "Edward II", "George II"], "a": [1], "e": "In May 1660 Parliament invited Charles II back from exile in the Netherlands; he was crowned King of England, Wales, Scotland and Ireland."}, {"n": 10, "q": "What is the title of the Queen's eldest son?", "o": ["Prince of Kent", "Prince of Wales", "Prince of Hanover", "Prince of Brunswick"], "a": [1], "e": "Prince Charles was the Prince of Wales (video's era)."}, {"n": 11, "q": "Under which king did the Anglo-Saxon kingdoms unite to defeat the Vikings?", "o": ["William of Orange", "King Alfred the Great", "Henry VIII", "Robert the Bruce"], "a": [1], "e": "The kingdoms united under Alfred the Great, who defeated the Vikings."}, {"n": 12, "q": "Who was given the title of Lord Protector?", "o": ["Charles I", "Charles II", "Winston Churchill", "Oliver Cromwell"], "a": [3], "e": "Cromwell was Lord Protector and ruled until his death in 1658."}, {"n": 13, "q": "Who is the patron saint of Scotland?", "o": ["St David", "St Patrick", "St George", "St Andrew"], "a": [3], "e": "St Andrew."}, {"n": 14, "q": "What kind of films did Academy Award winner Nick Park specialise in?", "o": ["Action movies", "Animated movies", "Thrillers", "Horror movies"], "a": [1], "e": "Britain is strong in special effects and animation. Nick Park has won four Oscars for animation, three for Wallace and Gromit."}, {"n": 15, "q": "What did Isaac Newton discover?", "o": ["Gravity", "Penicillin", "Insulin", "The light bulb"], "a": [0], "e": "His *Principia Mathematica* showed how gravity applied to the whole universe. He also discovered that white light is made up of the colours of the rainbow."}, {"n": 16, "q": "Which of the following actresses has NOT won an Oscar?", "o": ["Tilda Swinton", "Emily Watson", "Dame Judi Dench", "Kate Winslet"], "a": [1], "e": "Emily Watson hasn't won an Oscar (per the video)."}, {"n": 17, "q": "Who was a famous art deco ceramic designer?", "o": ["Alexander McQueen", "Thomas Chippendale", "Clarice Cliff", "Mary Quant"], "a": [2], "e": "Chippendale designed 18th-century furniture; Clarice Cliff designed art deco ceramics."}, {"n": 18, "q": "Who was William Wilberforce?", "o": ["A poet", "A sportsman", "A politician", "A musician"], "a": [2], "e": "An evangelical Christian MP who, with other abolitionists, turned public opinion against the slave trade."}, {"n": 19, "q": "What was Margaret Thatcher famous for?", "o": ["She was the first woman Prime Minister of the UK", "She set up the Women's Franchise League", "She was the founder of modern nursing", "She fought for women's right to vote"], "a": [0], "e": "She was the first woman PM."}, {"n": 20, "q": "Who was voted the greatest Briton of all time in 2002?", "o": ["Mo Farah", "Admiral Nelson", "Winston Churchill", "Clement Attlee"], "a": [2], "e": "Churchill was voted the greatest Briton in 2002. ucial aerial battle."}, {"n": 23, "q": "When did Germany invade Poland?", "o": ["1942", "1941", "1940", "1939"], "a": [3], "e": "1939."}, {"n": 24, "q": "In which country of the British Empire did the Boer War (1899–1902) take place?", "o": ["Netherlands", "Falkland Islands", "Gibraltar", "South Africa"], "a": [3], "e": "South Africa, with settlers from the Netherlands called Boers."}, {"n": 25, "q": "In which battle did Admiral Nelson die?", "o": ["The Battle of Hastings", "The Battle of Waterloo", "The Battle of Trafalgar", "The Battle of Bannockburn"], "a": [2], "e": "Trafalgar."}, {"n": 26, "q": "What battle is commemorated in the Bayeux Tapestry?", "o": ["The Battle of Waterloo", "The Battle of Trafalgar", "The Battle of Hastings", "The Battle of Britain"], "a": [2], "e": "The Battle of Hastings is commemorated in the great embroidery known as the Bayeux Tapestry."}, {"n": 27, "q": "Who supported King Charles I during the Civil War?", "o": ["Roundheads", "Suffragettes", "Quakers", "Cavaliers"], "a": [3], "e": "Cavaliers supported the king; Roundheads supported Parliament."}, {"n": 28, "q": "What is the name of the long war English kings fought with France in the Middle Ages?", "o": ["The Crimean War", "The First World War", "The Hundred Years War", "The Boer War"], "a": [2], "e": "It lasted 116 years even though it's called the Hundred Years War."}, {"n": 29, "q": "Who was supported by clansmen from the Scottish Highlands and raised an army in 1745?", "o": ["Bonnie Prince Charlie", "Robert Burns", "Oliver Cromwell", "Kenneth MacAlpin"], "a": [0], "e": "Charles Edward Stuart, grandson of James II, landed in Scotland to try to put a Stuart king back on the throne."}, {"n": 30, "q": "During Charles II's reign, parts of London were destroyed. What caused it?", "o": ["A war", "A flood", "A fire", "An earthquake"], "a": [2], "e": "The Great Fire destroyed much of the city, including many churches and St Paul's Cathedral."}, {"n": 31, "q": "What was the last battle between Great Britain and France?", "o": ["The Battle of Trafalgar", "The Battle of Waterloo", "The Battle of Hastings", "The Battle of Agincourt"], "a": [1], "e": "In 1815 Napoleon was defeated by the Duke of Wellington at Waterloo."}, {"n": 32, "q": "What led the American colonies to want independence from Britain?", "o": ["The British government wanted to control their borders", "They were running out of resources", "The British government wanted to tax them", "There weren't enough jobs"], "a": [2], "e": "The British government wanted to tax the colonies."}, {"n": 33, "q": "Which country was invaded by Germany in 1939?", "o": ["Austria", "Italy", "Russia", "Poland"], "a": [3], "e": "Poland."}, {"n": 34, "q": "When did the English defeat the Spanish Armada?", "o": ["1466", "1066", "1254", "1588"], "a": [3], "e": "1588."}, {"n": 35, "q": "Which TWO houses fought in the Wars of the Roses?", "o": ["The House of Chester", "The House of York", "The House of Lancaster", "The House of Newcastle"], "a": [1, 2], "e": "Supporters of the two families, Lancaster and York."}, {"n": 36, "q": "Women over 30 were given the vote because of their contribution to the war effort. Which war?", "o": ["The Second World War", "The Crimean War", "The First World War", "The Civil War"], "a": [2], "e": "In 1918 women over 30 got the vote, partly in recognition of their First World War contribution."}]}, {"name": "Chapter 8 – Science, Arts and Literature", "qs": [{"n": 1, "q": "Which British scientist co-discovered the structure of DNA in the 1950s?", "o": ["Sir Ian Wilmut", "Keith Campbell", "James Watt", "Francis Crick"], "a": [3], "e": "The DNA structure was discovered in 1953 through work in London and Cambridge. Francis Crick (1916–2004) was one of those awarded the Nobel Prize for it."}, {"n": 2, "q": "Isambard Kingdom Brunel was responsible for…", "o": ["The construction of the Great Western Railway", "The invention of the television", "The construction of the Tower of London", "The discovery of insulin"], "a": [0], "e": "Brunel was an engineer who built tunnels, bridges, railways and ships. The Great Western Railway runs from Paddington in London to the southwest of England, the West Midlands and Wales."}, {"n": 3, "q": "Who led a team of scientists to split the atom for the first time?", "o": ["Alexander Fleming", "Alan Turing", "Ernest Rutherford", "Sir Peter Mansfield"], "a": [2], "e": "Rutherford's teams at Manchester and Cambridge were first to split the atom."}, {"n": 4, "q": "What was invented by Alan Turing in the 1930s?", "o": ["The jet engine", "The television", "The Turing machine", "The ballpoint pen"], "a": [2], "e": "A theoretical mathematical device invented by the British mathematician Alan Turing (1912–54)."}, {"n": 5, "q": "During the Enlightenment, Adam Smith developed ideas about…", "o": ["Physics", "Economics", "Science", "Engineering"], "a": [1], "e": "His economic ideas are still referred to today."}, {"n": 6, "q": "Which poems are about a group of people going on a pilgrimage?", "o": ["The Canterbury Tales", "All the World's a Stage", "A Midsummer Night's Dream", "Great Expectations"], "a": [0], "e": "Geoffrey Chaucer wrote poems about travellers to Canterbury telling each other stories."}, {"n": 7, "q": "Which invention led to Britain's development during the Industrial Revolution?", "o": ["Magnetic resonance imaging", "Steam power", "Radar", "Hovercraft"], "a": [1], "e": "Britain industrialised on a large scale thanks to machinery and steam power."}, {"n": 8, "q": "Which country helped Britain develop Concorde?", "o": ["Germany", "Norway", "Italy", "France"], "a": [3], "e": "Britain and France developed the world's only supersonic commercial airliner."}, {"n": 9, "q": "Why were canals built during the Industrial Revolution?", "o": ["To link factories to towns, cities and ports", "To make space for the large fleet of British ships", "To increase the number of water mills", "To increase the amount of water in towns and cities"], "a": [0], "e": "Canals linked factories to towns, cities and ports, particularly in the new industrial areas of the Midlands and north."}, {"n": 10, "q": "Which poet was inspired by nature?", "o": ["John Masefield", "Wilfred Owen", "Siegfried Sassoon", "William Wordsworth"], "a": [3], "e": "Wordsworth and other British poets were inspired by nature."}, {"n": 11, "q": "Who invented the World Wide Web?", "o": ["Sir Tim Berners-Lee", "Sir Peter Mansfield", "Sir Ian Wilmut", "Sir Robert Edwards"], "a": [0], "e": "Sir Tim Berners-Lee."}, {"n": 12, "q": "Where is the Tate art gallery located?", "o": ["Glasgow", "Cardiff", "London", "Belfast"], "a": [2], "e": "Tate Britain and Tate Modern are in London."}, {"n": 13, "q": "What flower did William Wordsworth write about?", "o": ["Rose", "Daffodil", "Thistle", "Shamrock"], "a": [1], "e": "He wrote \"Daffodils\"."}, {"n": 14, "q": "What is the Enlightenment?", "o": ["A period of total peace in England", "A period when new ideas about politics, philosophy and science were developed", "A period when England became the largest empire the world had seen", "A period of economic recovery after the Second World War"], "a": [1], "e": "It was an 18th-century period of new ideas in politics, philosophy and science."}, {"n": 15, "q": "Where does the Fringe Festival take place?", "o": ["Fraserburgh", "Edinburgh", "Inverness", "St Andrews"], "a": [1], "e": "The Edinburgh Festival is a series of arts and cultural festivals every summer; the biggest is the Edinburgh Festival Fringe."}, {"n": 16, "q": "What stories are associated with Geoffrey Chaucer?", "o": ["The Cambridge Tales", "The Eastbourne Tales", "The Canterbury Tales", "The London Tales"], "a": [2], "e": "A series of poems about a group travelling to Canterbury on a pilgrimage."}, {"n": 17, "q": "What building was constructed in Hyde Park for the Great Exhibition of 1851?", "o": ["The Crystal Palace", "Buckingham Palace", "Kensington Palace", "Apsley House"], "a": [0], "e": "A huge building of steel and glass, with exhibits from huge machines to handmade goods."}, {"n": 18, "q": "Who was born in Stratford-upon-Avon?", "o": ["Jane Austen", "Charles Dickens", "William Shakespeare", "Thomas Hardy"], "a": [2], "e": "William Shakespeare."}, {"n": 19, "q": "What is the Proms?", "o": ["An annual awards event for best British group and best British solo artist", "An annual cultural festival of music, dance, art and performances largely in Welsh", "An 8-week summer season of daily orchestral classical music concerts"], "a": [2], "e": "It takes place in various venues, including the Royal Albert Hall in London."}, {"n": 20, "q": "What is the Turner Prize?", "o": ["A literature award", "A music award", "A contemporary art award", "A theatre award"], "a": [2], "e": "Established in 1984, it is one of Europe's most prestigious visual art awards."}, {"n": 21, "q": "The Man Booker Prize is awarded in which category?", "o": ["Films", "Sport", "Literature", "Music"], "a": [2], "e": "The prize for fiction has been awarded annually since 1968 for the best novel by an author from the Commonwealth, Ireland or Zimbabwe."}, {"n": 22, "q": "Who designed the Cenotaph?", "o": ["Sir Norman Foster", "Lancelot \"Capability\" Brown", "Sir Edwin Lutyens", "Isambard Kingdom Brunel"], "a": [2], "e": "Lutyens designed many war memorials, including the Cenotaph in Whitehall."}, {"n": 23, "q": "Which novel by J. R. R. Tolkien was voted the country's best-loved novel in 2003?", "o": ["Oliver Twist", "James Bond", "Pride and Prejudice", "The Lord of the Rings"], "a": [3], "e": "*The Lord of the Rings* was voted best-loved in 2003."}, {"n": 24, "q": "What type of literature are the Canterbury Tales?", "o": ["Poems", "Novels", "Jokes", "Fables"], "a": [0], "e": "An anthology of poems by Chaucer."}, {"n": 25, "q": "Who wrote Sherlock Holmes?", "o": ["Evelyn Waugh", "Sir Kingsley Amis", "Graham Greene", "Sir Arthur Conan Doyle"], "a": [3], "e": "Sir Arthur Conan Doyle."}, {"n": 26, "q": "What type of character did Charlie Chaplin play?", "o": ["A superhero", "A tramp", "A scientific genius", "A bandit"], "a": [1], "e": "Chaplin became famous in silent films for his tramp character and was one of many British actors to build a Hollywood career."}, {"n": 27, "q": "Who was the first person in England to print books using a printing press?", "o": ["William Shakespeare", "John Barber", "Geoffrey Chaucer", "William Caxton"], "a": [3], "e": "William Caxton."}, {"n": 28, "q": "Which play was written by William Shakespeare?", "o": ["Pride and Prejudice", "A Midsummer Night's Dream", "Sense and Sensibility", "Great Expectations"], "a": [1], "e": "Among Shakespeare's most famous plays."}, {"n": 29, "q": "Who wrote \"Daffodils\"?", "o": ["William Blake", "Robert Browning", "Lord Byron", "William Wordsworth"], "a": [3], "e": "William Wordsworth."}]}];
const L='ABCD';
let chap='all',list=[],i=0,showAll=false,shuffle=false;
const state={}; // key -> {sel:Set, done:bool}
const score={c:0,t:0};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
DATA.forEach((c,ci)=>c.qs.forEach(q=>{q.k=ci+'-'+q.n;q.ch=c.name;}));
const sel=$('#ch');
sel.innerHTML='<option value="all">All chapters (385)</option>'+DATA.map((c,ci)=>`<option value="${ci}">${c.name} (${c.qs.length})</option>`).join('');
function build(){
  list=chap==='all'?DATA.flatMap(c=>c.qs):DATA[+chap].qs.slice();
  if(shuffle){list=list.slice();for(let k=list.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[list[k],list[j]]=[list[j],list[k]];}}
  i=0;render();
}
function st(q){return state[q.k]||(state[q.k]={sel:new Set(),done:false});}
function render(){showAll?renderAll():renderOne();}
function renderOne(){
  const q=list[i],s=st(q),multi=q.a.length>1;
  const correct=s.done&&q.a.length===s.sel.size&&q.a.every(x=>s.sel.has(x));
  $('#app').innerHTML=`<div class="card">
  <div class="meta"><span>${esc(q.ch)} · Q${q.n}</span><span>${i+1} / ${list.length}</span></div>
  <div class="q">${esc(q.q)}</div>
  ${multi?`<div class="hint">Select ${q.a.length} answers</div>`:''}
  ${q.o.map((o,k)=>{
    let cls='opt';
    if(s.done){cls+=' lock'+(q.a.includes(k)?' ok':(s.sel.has(k)?' no':''));}
    else if(s.sel.has(k))cls+=' sel';
    const tag=s.done?(q.a.includes(k)?'✔ Correct':(s.sel.has(k)?'✘ Your pick':'')):'';
    return `<label class="${cls}" data-k="${k}"><input type="${multi?'checkbox':'radio'}" name="o" ${s.sel.has(k)?'checked':''} ${s.done?'disabled':''}><span><b>${L[k]})</b> ${esc(o)}</span><span class="tag">${tag}</span></label>`;}).join('')}
  ${s.done?`<div class="res ${correct?'ok':'no'}">${correct?'✅ Right answer!':'❌ Wrong answer'}
    <div class="ex"><b>Correct:</b> ${q.a.map(k=>L[k]+') '+esc(q.o[k])).join(' &nbsp;|&nbsp; ')}<br><b>Explanation:</b> ${esc(q.e)}</div></div>`:''}
  </div>
  <div class="nav"><button id="prev" ${i===0?'disabled':''}>← Previous</button>
  <button id="sub" class="p" ${s.done||!s.sel.size?'disabled':''}>Submit</button>
  <button id="next" ${i===list.length-1?'disabled':''}>Next →</button></div>
  <p class="score">Score: ${score.c} correct / ${score.t} answered</p>`;
  document.querySelectorAll('.opt').forEach(el=>el.onclick=e=>{
    if(s.done)return;e.preventDefault();const k=+el.dataset.k;
    if(multi){s.sel.has(k)?s.sel.delete(k):s.sel.add(k);}else{s.sel=new Set([k]);}
    renderOne();});
  $('#sub').onclick=()=>{s.done=true;score.t++;if(q.a.length===s.sel.size&&q.a.every(x=>s.sel.has(x)))score.c++;renderOne();};
  $('#prev').onclick=()=>{i--;renderOne();scrollTo(0,0);};
  $('#next').onclick=()=>{i++;renderOne();scrollTo(0,0);};
}
function renderAll(){
  let last='';
  $('#app').innerHTML=list.map(q=>{
    const h=q.ch!==last?`<h2 class="ch">${esc(q.ch)}</h2>`:'';last=q.ch;
    return h+`<div class="card"><div class="meta"><span>Q${q.n}</span>${q.a.length>1?`<span>${q.a.length} correct answers</span>`:''}</div>
    <div class="q">${esc(q.q)}</div>
    ${q.o.map((o,k)=>`<div class="opt lock ${q.a.includes(k)?'ok':''}"><span><b>${L[k]})</b> ${esc(o)}</span><span class="tag">${q.a.includes(k)?'✅':''}</span></div>`).join('')}
    <div class="ex" style="margin-top:8px"><b>Explanation:</b> ${esc(q.e)}</div></div>`;}).join('');
}
sel.onchange=()=>{chap=sel.value;build();};
$('#mode').onclick=()=>{showAll=!showAll;$('#mode').textContent=showAll?'Back to quiz':'Show all';render();scrollTo(0,0);};
$('#shuf').onclick=()=>{shuffle=!shuffle;$('#shuf').textContent='Shuffle: '+(shuffle?'on':'off');build();};
$('#reset').onclick=()=>{for(const k in state)delete state[k];score.c=score.t=0;i=0;render();};
build();
</script></body></html>
